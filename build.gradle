 plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'third-tool'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    // Story-053 (ADR019 §1.2): Spring Cloud AWS — Secrets Manager 부팅 통합.
    // BOM으로 spring-cloud-aws-* 의존 버전을 단일 출처로 고정.
    set('springCloudAwsVersion', '3.2.1')
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Prometheus scrape endpoint (Story 4-1, 0-b 메트릭 Epic 1)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    //querydsl
    implementation "com.querydsl:querydsl-jpa:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    implementation "com.querydsl:querydsl-core"
    implementation "com.querydsl:querydsl-collections"
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta" // querydsl JPAAnnotationProcessor 사용 지정
    annotationProcessor "jakarta.annotation:jakarta.annotation-api" // java.lang.NoClassDefFoundError (javax.annotation.Generated) 대응 코드
    annotationProcessor "jakarta.persistence:jakarta.persistence-api" // java.lang.NoClassDefFoundError (javax.annotation.Entity) 대응 코드

    //jwt 관련
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    //타임리프+webclient
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.3.3'

    // AWS SDK S3 — Spring Cloud AWS BOM(${springCloudAwsVersion})이 awssdk:core/regions 등을
    // 함께 pin하므로 version 명시 없이 BOM 정렬에 위임 (s3:2.30.0 ↔ awssdk:core 버전 mismatch 회피).
    implementation 'software.amazon.awssdk:s3'

    // Story-053 (ADR019): Spring Cloud AWS Secrets Manager — application-prod.yml의
    // spring.config.import 경로로 부팅 시 aws-secretsmanager:thirdtool/{env}/* 시크릿 fetch.
    // M1 단계에서는 'optional:' prefix로 미존재 시 부팅 진행 (Task Def secrets env var가 주 경로).
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    // Flyway
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'de.huxhorn.sulky:de.huxhorn.sulky.ulid:8.3.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework:spring-web'   // MultipartFile 인터페이스
    implementation 'org.springframework:spring-test'  // ✅ MockMultipartFile (런타임에서도 사용)

    // 구조화 로그 (ADR008) — profile별 JSON Appender에서 사용
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

}

// Querydsl 설정부
def generated = 'src/main/generated'

// querydsl QClass 파일 생성 위치를 지정
tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(generated))
}

// java source set 에 querydsl QClass 위치 추가
sourceSets {
    main.java.srcDirs += [ generated ]
}

// gradle clean 시에 QClass 디렉토리 삭제
clean {
    delete file(generated)
}


tasks.named('test') {
    useJUnitPlatform()
}
