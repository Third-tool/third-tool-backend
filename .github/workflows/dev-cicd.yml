# Story-046: GHA → AWS 인증을 OIDC AssumeRole로 전환.
#   - aws-actions/configure-aws-credentials@v4 step이 `role-to-assume`만 사용
#     (long-lived access key 폐기) → 1시간 TTL 임시 자격증명을 STS가 발급
#   - 신뢰 정책 sub 조건으로 repo:Third-tool/third-tool:ref:refs/heads/main 잠금
#     (fork PR · 임의 branch 차단). 자세한 셋업 절차는 ts007 runbook 참조
#   - EC2 SSH 배포 step의 AWS_ACCESS_KEY_ID/SECRET env var pass-through는
#     transitional 유지 — milestone #11 ECS Task Role 이행 시 일괄 제거 예정
name: Deploy To EC2 (dev-version)

on:
  # 👉 main 브랜치 push 시 Spring 서버 자동 배포
  push:
    branches:
      - main

  # 👉 수동 실행 시 ES 이미지 빌드 가능
  workflow_dispatch:
    inputs:
      build_es:
        description: 'Build & push Elasticsearch (Nori) image to ECR'
        required: true
        default: false
        type: boolean

# OIDC ID token 발급 권한 — Story-046. 모든 job에 적용.
permissions:
  contents: read
  id-token: write

jobs:
  # ======================================================
  # 1️⃣ Elasticsearch(Nori) 이미지 빌드 (수동 전용)
  # ======================================================
  build-es-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_es == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Story-046: OIDC AssumeRole — long-lived access key 폐기
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-deploy-role
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push ES Image
        run: |
          echo "🚀 Building Elasticsearch (Nori) Image..."
          docker build -t third-tool-elasticsearch -f ./Dockerfile-elasticsearch .
          docker tag third-tool-elasticsearch:latest \
            ${{ steps.login-ecr.outputs.registry }}/third-tool-elaticsearch:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/third-tool-elaticsearch:latest

  # ======================================================
  # 2️⃣ Spring Boot 서버 빌드 & EC2 배포
  # ======================================================
  deploy-app:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ AWS 자격 증명
      # Story-046: OIDC AssumeRole — long-lived access key 폐기.
      # gha-deploy-role 신뢰 정책이 repo:Third-tool/third-tool:ref:refs/heads/main 잠금.
      # (Story 1-1: host gradle build 단계 삭제 — Docker builder stage가 동일 작업
      #  수행하고 .dockerignore가 build/를 차단해 host 산출물은 image에 미반영)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-deploy-role
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com

      # 3️⃣ ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Spring Image Build (Story 1-1: 단일 루트 Dockerfile 통합 + builder stage가 gradle bootJar 수행)
      - name: Build Docker image
        run: docker build -t third-tool-server -f ./Dockerfile .

      # 5️⃣ 태그 지정
      - name: Tag Docker image
        run: docker tag third-tool-server:latest ${{ steps.login-ecr.outputs.registry }}/third-tool-server:latest

      # 6️⃣ Push Image to ECR
      - name: Push to Amazon ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/third-tool-server:latest

      # 9️⃣ EC2 SSH 배포
      # TODO Story #11 (ECS Task Role 이행): 본 step 전체 — EC2 SSH 배포 + AWS_ACCESS_KEY_ID/SECRET
      # env var pass-through — 는 ECS 이행 시 제거 예정. ECS Task Role 자동 주입 +
      # S3Config의 DefaultCredentialsProvider 전환과 함께 묶음. ADR013 follow-up 참조.
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Starting deployment on EC2..."

            cd /home/ubuntu/third-tool || mkdir -p /home/ubuntu/third-tool
            cd /home/ubuntu/third-tool

            # ECR 로그인
            ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            # compose 기반 infra 업데이트 (mysql, redis, es)
            docker compose pull || true
            docker compose down || true
            docker compose up -d

            echo "⏳ Waiting for MySQL to be ready..."
            for i in {1..5}; do
              if docker exec local-mysql-db mysqladmin ping -h"localhost" --silent; then
                echo "✅ MySQL is ready!"
                break
              fi
              echo "⏱️ retry ($i/5)"
              sleep 5
            done

            echo "⏳ Waiting for Elasticsearch to be ready..."
            for i in {1..12}; do
              if curl -s --fail http://localhost:9200/_cluster/health >/dev/null; then
                echo "✅ Elasticsearch is ready!"
                break
              fi
              echo "⏱️ retry ($i/12)"
              sleep 5
            done

            # 기존 spring 컨테이너 삭제
            docker stop third-tool-server || true
            docker rm third-tool-server || true

            echo "📦 Pulling latest Spring image..."
            docker pull $ECR_REGISTRY/third-tool-server:latest

            # 🧹 쓰레기 이미지 자동 삭제
            echo "🧹 Cleaning unused Docker images..."
            docker image prune -af

            # Spring Boot 실행
            # NOTE Story-046: AWS_ACCESS_KEY_ID/SECRET env 주입은 transitional 유지.
            # GHA → AWS 인증은 OIDC로 전환됐지만, EC2 컨테이너 안의 S3Config가 여전히
            # StaticCredentialsProvider 사용 중이라 env 변수 주입 필요.
            # 제거 시점: #11 ECS Task Role 이행 + S3Config → DefaultCredentialsProvider.
            echo "⚙️ Running Spring Boot container..."
            docker run -d \
              --name third-tool-server \
              --network third-tool-net \
              -p 8080:8080 \
              -v /home/ubuntu/third-tool/application.yml:/app/config/application.yml \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e TZ=Asia/Seoul \
              $ECR_REGISTRY/third-tool-server:latest

            echo "🔍 Containers running:"
            docker ps

            echo "🎉 Deployment Success!"
